version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=eventia_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FLASK_ENV=production
      - FLASK_PORT=5000
    depends_on:
      - mysql
      - redis
    networks:
      - eventia-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: eventia_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - eventia-network

  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    networks:
      - eventia-network

volumes:
  mysql-data:

networks:
  eventia-network:
    driver: bridge